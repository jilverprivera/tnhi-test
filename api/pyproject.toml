[project]
name = "tac-radicacion"
version = "0.1.0"
description = "Radicación asistida de correspondencia - TAC"
authors = [
    { name = "Jilver Pacheco", email = "jilverrivera1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "holidays>=0.109",
    "mcp[cli]>=2.3.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.11",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Fixture generator written blind (without seeing the code): kept exactly as authored
extend-exclude = ["tests/blind/generar.py"]
