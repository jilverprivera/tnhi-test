# Render blueprint: demo API (Docker) with persistent disk. Fictitious data only.
services:
  - type: web
    name: docket-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: docket-data
      mountPath: /data
      sizeGB: 1
    # Every variable is explicit: the code has no defaults (see api/.env.example).
    envVars:
      - key: TAC_DATA_DIR
        value: /data
      - key: TAC_DATABASE_URL
        sync: false # Render Postgres connection string
      - key: TAC_INBOX_DIR
        value: /srv/material/2-bandeja-de-entrada
      - key: TAC_SUPPLIERS_CSV
        value: /srv/material/3-datos-del-cliente/maestro-proveedores.csv
      - key: TAC_DEPARTMENTS_CSV
        value: /srv/material/3-datos-del-cliente/dependencias.csv
      - key: TAC_LEDGER_XLSX
        value: /srv/material/3-datos-del-cliente/libro-radicacion-2026.xlsx
      - key: TAC_TODAY
        value: "2026-11-18"
      - key: TAC_COMPANY_NIT
        value: 900.100.200-3
      - key: TAC_FILING_PREFIX
        value: TAC-2026-ER-
      - key: TAC_OCR_LANGUAGE
        value: spa
      - key: TAC_MIN_OCR_CONFIDENCE
        value: "70"
      - key: TAC_MIN_CLASSIFICATION_MARGIN
        value: "2"
      - key: TAC_LLM_ENABLED
        value: "false"
      - key: TAC_WORKER_ENABLED
        value: "true"
      - key: TAC_WORKER_POLL_SECONDS
        value: "0.5"
      - key: TAC_LEDGER_SYNC_SECONDS
        value: "30"
      - key: TAC_CORS_ORIGINS
        value: '["https://docket-tac.vercel.app"]'
      - key: TAC_CLERK_TOKEN
        generateValue: true
      - key: TAC_COORDINATOR_TOKEN
        generateValue: true
